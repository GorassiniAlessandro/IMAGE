[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-image-studio"
version = "0.1.0"
description = "Studio personale per generare immagini"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Alessandro" }
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "deep-translator>=1.11"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
local-ai = [
  "torch>=2.5",
  "torchvision>=0.20",
  "diffusers>=0.35",
  "transformers>=4.46",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "peft>=0.13",
  "datasets>=3.0",
  "numpy>=1.26",
  "pillow>=11.0",
  "tqdm>=4.66"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
